<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고등교육기관 학교개황 및 공시 자료</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* VOICE: 내부 통계 대시보드 — 재정·결산 대시보드와 같은 HEDX 계열, 차분하고 촘촘하게
   IDEA: 대교협 FOCUS 보고서와 학교개황 원장(元帳)을 한 화면에서 넘겨보는 데스크
   PICTURE: 첫 화면은 연도별 기관 수 누적 막대 + 변동 타임라인
   COLOUR and TYPE: HEDX 네이비 #14365f / 블루 #1f5a96 / 앰버 배지, Noto Sans KR
   LAYOUT: 상단 바 · 탭 · 좌측 필터 · 우측 카드 그리드 (재정·결산 대시보드와 동일 골격) */
:root{--bg:#f4f5f7;--panel:#fff;--ink:#14181f;--ink2:#4a5160;--muted:#737a8a;--line:#e2e5ea;--line2:#eef0f3;--brand:#14365f;--brand2:#1f5a96;--accent:#2a78d6;--ok:#11734f;--neg:#c0392b;
--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#6250d6;--c7:#008300;--c8:#9aa1ad}
:root[data-theme=dark]{--bg:#0f141b;--panel:#171e28;--ink:#e8ecf2;--ink2:#b5bdca;--muted:#8a93a3;--line:#2a3442;--line2:#222b37}
*{box-sizing:border-box;min-width:0}
body{margin:0;word-break:keep-all;overflow-wrap:break-word;font-family:"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;overflow-x:clip}
button,select,input{font:inherit;color:inherit}
.top{background:var(--brand);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:19px;margin:0;font-weight:700}
.top .sub{font-size:12px;opacity:.85}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:#ffd88a;color:#5a3500;vertical-align:2px}
.tabs{display:flex;gap:2px;background:#0f2a4a;padding:0 16px;overflow-x:auto}
.tabs button{background:none;border:0;color:#c9d6e6;padding:11px 14px;cursor:pointer;font-weight:500;white-space:nowrap;border-bottom:3px solid transparent;min-height:44px}
.tabs button.on{color:#fff;border-bottom-color:#ffd88a}
.wrap{display:grid;grid-template-columns:262px minmax(0,1fr);gap:16px;padding:16px;align-items:start}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.side{position:static!important;max-height:none!important}}
.side{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto}
.side h3{font-size:13px;margin:0 0 8px;color:var(--brand2)}
.fg{margin-bottom:11px}.fg>label{display:block;font-size:12px;color:var(--ink2);font-weight:500;margin-bottom:3px}
select,input[type=search]{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.chk{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px}.chk label{display:flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}.seg button{flex:1;border:0;background:var(--panel);padding:6px 0;cursor:pointer;font-size:12.5px}.seg button.on{background:var(--brand2);color:#fff}
.btn{background:var(--brand2);color:#fff;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn.ghost{background:var(--panel);color:var(--brand2);border:1px solid #c5d3e4}.btn.sm{padding:4px 9px;font-size:12px}
.note{font-size:12px;color:var(--muted);margin:6px 0}
.hide{display:none!important}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chip{background:#e8eef6;color:var(--brand);border-radius:12px;padding:2px 10px;font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--brand2);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card h2 small{font-weight:400;color:var(--muted);font-size:12px}
.lead{font-size:16px;font-weight:700;margin:0 0 12px;line-height:1.45}.lead .ln{display:block;padding-left:14px;position:relative;margin:2px 0}.lead .ln::before{content:"";position:absolute;left:2px;top:.65em;width:5px;height:5px;border-radius:50%;background:var(--c1,#1f5aa6)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 13px}
.kpi .l{font-size:12px;color:var(--ink2)}.kpi .v{font-size:clamp(18px,2vw,22px);font-weight:700;margin-top:2px}.kpi .v small{font-size:12px;font-weight:500;color:var(--muted);margin-left:2px}.kpi .d{font-size:12px}
.up{color:var(--ok)}.dn{color:var(--neg)}.flat{color:var(--muted)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:10px}.ctrl .fg{margin:0;min-width:150px}
.tw{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:8px}
table.t{border-collapse:collapse;width:100%;font-size:12.5px}
table.t th,table.t td{padding:5px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.t th{background:#f0f3f7;position:sticky;top:0;z-index:1;font-weight:700;color:#4a5160;text-align:center}
:root[data-theme=dark] table.t th{background:#1d2633;color:var(--ink2)}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums}table.t td.w{white-space:normal;min-width:180px}
table.t tr.tot td{background:#eaf0f7;font-weight:700}:root[data-theme=dark] table.t tr.tot td{background:#1d2633}
table.t th.s{cursor:pointer}
.hb{display:inline-block;font-size:10.5px;font-weight:700;padding:0 6px;border-radius:8px;margin-left:4px;vertical-align:1px}
.k-특별법{background:#fff0d9;color:#8a5200}.k-직업능력개발법{background:#e6f4ea;color:#11643f}
.ir{cursor:pointer}.ir:hover td{background:#eef4fb!important}
.dl{display:grid;grid-template-columns:118px minmax(0,1fr);gap:6px 12px;font-size:13px;margin:10px 0}.dl dt{color:var(--ink2);font-weight:700}.dl dd{margin:0}
.gd{background:#f6f8fb;border-left:3px solid var(--brand2);padding:8px 10px;font-size:12.5px;line-height:1.6;white-space:pre-line}
.k-폐교{background:#fde2e1;color:#a2231d}.k-통합{background:#e6e1fb;color:#4b3aa8}.k-교명변경,.k-표기변경{background:#e1effc;color:#1b5a9a}.k-신설{background:#ddf3e8;color:#11643f}
.m-수시{background:#eef0f3;color:#4a5160}.m-별도{background:#fff0d9;color:#8a5200}.m-4월{background:#e1effc;color:#1b5a9a}.m-6월{background:#ddf3e8;color:#11643f}.m-8월{background:#fde8dc;color:#9a3d0b}.m-10월{background:#e6e1fb;color:#4b3aa8}
.uname{color:var(--accent);cursor:pointer}
.fig{position:relative;height:300px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}.fig.sm{height:240px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink2);margin:4px 0 6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.bars .r{display:grid;grid-template-columns:96px minmax(0,1fr) 58px;gap:8px;align-items:center;font-size:12.5px;margin:3px 0}
.bars .r b{display:block;height:14px;border-radius:3px;background:var(--brand2)}.bars .r span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.tl{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto;font-size:12.5px}
.tl .y{font-weight:700;color:var(--brand2);margin-top:4px}
.stat{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.sc{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.sc .h{font-size:12px;color:var(--ink2);display:flex;justify-content:space-between;gap:6px}.sc .k{font-weight:700;margin:2px 0 6px}
.sc .p{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:6px;align-items:center;font-size:12.5px;margin:2px 0}
.sc .p b{height:10px;border-radius:2px;display:block}.sc .def{font-size:11.5px;color:var(--muted);margin-top:4px}
#tip{position:fixed;pointer-events:none;background:#14181f;color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;z-index:50;opacity:0;max-width:320px;white-space:pre-line}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#14365f;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;z-index:60}.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(10,20,35,.45);display:flex;align-items:center;justify-content:center;z-index:70;padding:16px}
.modal .box{background:var(--panel);border-radius:12px;max-width:720px;width:100%;max-height:86vh;overflow:auto;padding:18px 20px}
.yr{display:flex;flex-wrap:wrap;gap:3px;margin:8px 0}.yr span{font-size:11px;padding:2px 6px;border-radius:4px;background:#eef0f3;color:#9aa1ad}.yr span.on{background:var(--brand2);color:#fff}
.seclist{border:1px solid var(--line);border-radius:6px;padding:8px;font-size:12.5px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 10px}
.rep-wrap{background:#dde1e7;padding:16px;border-radius:10px;overflow:auto}
#report{background:#fff;width:210mm;max-width:100%;margin:0 auto;color:#111;font-size:10pt;line-height:1.62;box-shadow:0 2px 14px rgba(0,0,0,.15)}
#report .pg{padding:8mm 13mm 10mm}
#report .rhead{background:#14365f;color:#fff;padding:9mm 13mm 7mm;position:relative}
#report .rhead .series{font-size:9pt;font-weight:700;opacity:.85}#report .rhead .issue{position:absolute;right:13mm;top:9mm;font-size:9pt;opacity:.9}
#report .rhead h1{font-size:18.5pt;margin:6px 0 4px;font-weight:900;line-height:1.3}#report .rhead .lede{font-size:10pt;opacity:.92}
.rhead .rby{font-size:9pt;opacity:.85;margin-top:6px}
#report .hl{padding:5mm 13mm;background:#eef3f9;border-bottom:3px solid #14365f}#report .hl ul{margin:0;padding-left:16px}#report .hl li{margin:2px 0;font-weight:500}
#report h2.grp{font-size:12pt;color:#fff;background:#1f5a96;padding:4px 10px;margin:16px 0 8px;border-radius:2px}
#report h3.sec{font-size:10.8pt;color:#14365f;margin:12px 0 4px}#report h3.sec::before{content:"● "}
#report ul.b{margin:2px 0 6px;padding-left:0;list-style:none}#report ul.b li{padding-left:12px;text-indent:-10px;margin:2px 0}#report ul.b li::before{content:"- "}
#report .cap{text-align:center;font-weight:700;font-size:9.5pt;margin:10px 0 2px}#report .unit{text-align:right;font-size:8pt;color:#444}
#report table.rt{border-collapse:collapse;width:100%;font-size:8pt;border-top:2px solid #14365f;border-bottom:2px solid #14365f}
#report table.rt th,#report table.rt td{border:1px solid #c9ced6;padding:2px 5px;text-align:right}
#report table.rt th{background:#e9eef5;text-align:center}#report table.rt td.l{text-align:left}#report table.rt tr.tot td{background:#e4eaf2;font-weight:700}
#report .fn{font-size:7.8pt;color:#444;margin:3px 0 8px}
#report .remark{border:2px solid #14365f;border-radius:6px;padding:8px 12px;margin:14px 0 6px;background:#fbfcfe}#report .remark .rt-title{font-weight:900;color:#14365f;font-size:11pt;margin-bottom:4px}
#report .foot{display:flex;justify-content:space-between;font-size:8pt;color:#555;border-top:1px solid #ccd;padding-top:4px;margin-top:10px}
#report .fig{height:auto}#report .fig svg{position:static;width:100%;height:auto}
#report [contenteditable]:hover{outline:1px dashed #9ab}
.rgrid{display:grid;grid-template-columns:350px minmax(0,1fr);gap:14px;align-items:start}@media(max-width:1200px){.rgrid{grid-template-columns:1fr}}
.rset{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto}
.fmtsw{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}.fmtsw button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px;cursor:pointer;text-align:left;font-weight:700}.fmtsw button small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}.fmtsw button.on{border-color:var(--brand2);background:#e8eef6;color:var(--brand)}
.pklist{border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-height:420px;overflow:auto}
.pk{display:flex;align-items:flex-start;gap:6px;font-size:12.5px;padding:3px 0;border-bottom:1px dashed var(--line2)}.pk label{flex:1;cursor:pointer}.pk .lnk{background:none;border:0;color:var(--accent);cursor:pointer;font-size:12px;white-space:nowrap;padding:2px}
.pkg{font-weight:700;color:var(--brand2);margin:8px 0 2px}.pkg small{color:var(--muted);font-weight:400}
#report .rcover{background:#14365f;color:#fff;padding:40mm 16mm 30mm;min-height:200mm;display:flex;flex-direction:column}#report .rcno{font-size:10pt;opacity:.85}#report .rctit{font-size:24pt;font-weight:900;line-height:1.3;margin:20mm 0 6mm}#report .rcsub{font-size:12pt;opacity:.9}#report .rcby{margin-top:auto;font-size:11pt;line-height:1.7}#report .rcdate{font-size:10pt;opacity:.8;margin-top:4mm}
#report .rchap{padding:24mm 16mm 10mm;border-top:14px solid #d9dde3}#report .rcnum{font-size:38pt;font-weight:900;color:#14365f;line-height:1}#report .rctitle{font-size:19pt;font-weight:900;margin:4mm 0 6mm;border-bottom:3px solid #14365f;padding-bottom:4mm}#report .rcsubs{font-size:11pt;color:#334;line-height:2}
@media print{#report .rcover,#report .rchap{break-before:page;page-break-before:always}}
.kgh{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--accent);margin:6px 0 -2px;border-bottom:1px solid var(--line);padding-bottom:2px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
.kp{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;font:inherit;color:inherit}
.kp .kn{font-size:12px;color:var(--muted);line-height:1.3}.kp b{font-size:18px}.kp b small{font-size:11px;font-weight:400;color:var(--muted);margin-left:2px}.kp .ks{font-size:11.5px;color:var(--muted)}
.dir{font-size:10.5px;color:var(--muted);font-weight:500}.dir.up{color:var(--ok)}.dir.dn{color:#b5530c}
.kp .ks .tier{font-weight:700;color:var(--ink2);white-space:nowrap}.kp .ks .tier.up{color:var(--ok)}.kp .ks .tier.dn{color:#b5530c}
.kp.good{border-left:4px solid #1baf7a}.kp.bad{border-left:4px solid #eb6834}.kp.on{outline:2px solid var(--brand2);background:#e8eef6}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.anb{border-left:3px solid #1f5a96;background:#f3f7fc;padding:6px 10px;margin:6px 0 10px}.anb .anh{font-weight:700;font-size:9.5pt;color:#14365f;margin-bottom:2px}
</style>
</head>
<body>
<div class="top">
  <div>
    <h1>고등교육기관 학교개황 및 공시 자료 <span class="badge">HEDX / © DS2IXY. ALL RIGHTS RESERVED</span></h1>
    <div class="sub">대학정보공시 학교개황 2015~2026 · 공시항목(2026 지침서) · 2026년 4·6·8·10월 대학정보공시 분석 결과 · 출처 대학알리미(한국대학교육협의회)</div>
  </div>
</div>
<nav class="tabs" id="tabs"></nav>
<div class="wrap">
  <aside class="side">
    <h3>분석 범위 · 필터</h3>
    <div class="fg"><label>분석 범위 (프리셋)</label><select id="f-scope"><option value="">전체 고등교육기관</option><option value="대학,교육대학">4년제 (대학+교육대학)</option><option value="대학">대학</option><option value="교육대학">교육대학</option><option value="전문대학">전문대학 (고등교육법)</option><option value="원격대학">원격대학 (사이버·방송통신)</option><option value="전문대학,기능대학">전문대학 + 기능대학 (직업교육)</option><option value="기능대학">기능대학 (폴리텍 등)</option><option value="대학원대학">대학원대학</option><option value="대학,교육대학,전문대학">4년제 + 전문대학</option></select></div>

    <div class="fg"><label>추이 기간</label><div class="seg" id="f-per"><button data-v="3">3년</button><button data-v="5">5년</button><button data-v="10" class="on">10년</button><button data-v="99">전체</button></div></div>
    <div class="fg"><label>집계 단위</label><div class="seg" id="f-unit"><button data-v="inst" class="on">기관</button><button data-v="camp">캠퍼스</button></div></div>
    <div class="fg"><label>학교 구분</label><div class="chk" id="f-g"></div></div>
    <div class="fg"><label>설립</label><div class="chk" id="f-e"></div></div>
    <div class="fg"><label>설립 근거 법률</label><div class="chk" id="f-b"></div></div>
    <div class="fg"><label>권역</label><div class="chk" id="f-r"></div></div>
    <div class="fg"><label>학교 상태 <small class="note">(공시지표·학교별 지표 탭)</small></label><div class="chk" id="f-st"></div></div>
    <div class="fg"><label>시도</label><select id="f-s"><option value="">전체</option></select></div>
    <div class="fg"><label>학교명 검색</label><input type="search" id="f-q" placeholder="대학명 입력"></div>
    <button class="btn ghost sm" id="reset" style="width:100%">필터 초기화</button>
    <p class="note" style="margin-top:12px">기관: 같은 학교의 본교·캠퍼스를 하나로 셉니다(폴리텍은 I~VII·특성화대학 단위). 평생교육법상 사내대학·원격대학은 공시 대상이 아니므로 제외했습니다. 권역: 수도권(서울·경기·인천), 광역시(부산·대구·광주·대전·울산·세종), 도 지역.</p>
  </aside>
  <main>
    <div class="chips" id="chips"></div>
    <section id="v-ov"></section><section id="v-tr" class="hide"></section><section id="v-ls" class="hide"></section><section id="v-si" class="hide"></section>
<section id="v-ia" class="hide"></section>

    <section id="v-it" class="hide"></section>
    <section id="v-st" class="hide"></section><section id="v-rp" class="hide"></section><section id="v-ab" class="hide"></section>
  </main>
</div>
<div id="tip"></div><div class="toast" id="toast"></div><div id="modal"></div>
<script>
{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmt=(v,d=0)=>v==null||isNaN(v)?'–':Number(v).toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});

let D,REC,YEARS,S={y:2026,per:10,unit:'inst',g:new Set(),e:new Set(),r:new Set(),b:new Set(),st:new Set(),s:'',q:''},TAB='ov';
const tip=$('#tip');
function showTip(e,t){tip.textContent=t;tip.style.opacity=1;tip.style.left=Math.min(e.clientX+12,innerWidth-330)+'px';tip.style.top=(e.clientY+12)+'px'}
function hideTip(){tip.style.opacity=0}

// ---------- data
function decode(raw){
  const d=raw.D;
  REC=raw.R.map(r=>({y:r[0],nm:r[1],ins:d['기관'][r[2]],bb:d['본분교'][r[3]],g:d['구분'][r[4]],hj:d['학제'][r[5]],sd:d['지역'][r[6]],e:d['설립2'][r[7]],rg:d['권역'][r[8]],corp:d['법인명'][r[9]],st:d['학교상태'][r[10]],oy:r[11],url:r[12],bs:d['근거'][r[13]]}));
  REC.forEach(r=>{r.g=GX(r.g,r.hj,r.bs)});REC.forEach(r=>{NAMEG[r.nm]=r.g;NAMEG[r.ins]=r.g});
  YEARS=[...new Set(REC.map(r=>r.y))].sort();
  D=raw; D.GR=raw.G.map(g=>({y:g[0],ins:d['기관'][g[1]],a:g[2],b:g[3],c:g[4]}));
  D.EVL=raw.EV.map(x=>({y:x[0],t:x[1],n:x[2],g:NAMEG[x[2]]||x[3],e:x[4],r:x[5],m:x[6]}));
}
const GORDER=['대학','교육대학','전문대학','원격대학','기능대학','대학원대학','기타'];
// 학교구분: 고등교육법 제2조 종류 기준으로 재분류(교육대학·원격대학 분리, 전문대학은 고등교육법 전문대학만)
function GX(g,hj,bs){hj=hj||'';if(hj==='교육대학')return '교육대학';if(/사이버|방송통신/.test(hj))return '원격대학';if(g==='전문대학'&&bs==='특별법')return '기타';if(/각종학교/.test(hj))return '기타';return g}
let NAMEG={};const BORDER=['고등교육법','특별법','직업능력개발법'], EORDER=['국립','공립','사립','특별법법인','기타'], RORDER=['수도권','광역시','도 지역'];
function pass(r,skipQ){
  if(S.g.size&&!S.g.has(r.g))return false; if(S.e.size&&!S.e.has(r.e))return false; if(S.r.size&&!S.r.has(r.rg))return false;
  if(S.b.size&&!S.b.has(r.bs))return false; if(S.s&&r.sd!==S.s)return false; if(!skipQ&&S.q&&!(r.nm.includes(S.q)||r.ins.includes(S.q)))return false; return true;
}
const rowsY=y=>REC.filter(r=>r.y===y&&pass(r));
function count(rows){return S.unit==='inst'?new Set(rows.map(r=>r.ins)).size:rows.length}
function groupCount(rows,key,order){const m={};for(const r of rows){(m[r[key]]=m[r[key]]||[]).push(r)}const ks=order?order.filter(k=>m[k]).concat(Object.keys(m).filter(k=>!order.includes(k)).sort()):Object.keys(m).sort();return ks.map(k=>[k,count(m[k])])}
const perYears=()=>YEARS.filter(y=>y>S.y-S.per&&y<=S.y);
const EVBADGE={};

// ---------- charts (svg at real pixel size)
function mount(el,draw){const ro=new ResizeObserver(()=>draw(el.clientWidth,el.clientHeight));ro.observe(el);draw(el.clientWidth,el.clientHeight)}
function stackBars(el,cats,series,unit){
  mount(el,(W,H)=>{if(!W)return;const L=44,R=10,T=14,B=26,n=cats.length;const tot=cats.map((_,i)=>series.reduce((a,s)=>a+(s.v[i]||0),0));const mx=Math.max(1,...tot)*1.12;
  const bw=(W-L-R)/n,y=v=>T+(H-T-B)*(1-v/mx);let g='';const tk=5;for(let i=0;i<=tk;i++){const v=mx/tk*i;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="currentColor" opacity=".1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="currentColor" opacity=".6">${fmt(v)}</text>`}
  cats.forEach((c,i)=>{let acc=0;const x=L+i*bw+bw*.18,w=bw*.64;series.forEach((s,k)=>{const v=s.v[i]||0;if(!v)return;g+=`<rect x="${x}" y="${y(acc+v)}" width="${w}" height="${y(acc)-y(acc+v)}" fill="${s.c}" data-t="${esc(c+' · '+s.n+': '+fmt(v)+unit)}"/>`;acc+=v});
  if(W>520||i%2===0)g+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="currentColor" opacity=".75">${W<520?String(c).slice(2):c}</text>`;
  if(bw>34)g+=`<text x="${x+w/2}" y="${y(acc)-4}" text-anchor="middle" font-size="10.5" font-weight="700" fill="currentColor">${fmt(acc)}</text>`});
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;bindTip(el)})}
// 축 범위: 데이터가 좁은 구간에 몰려 있으면 0부터 그리지 않고 하한·상한을 깔끔한 눈금으로 맞춤
function niceAxis(lo,hi,n=5){if(!isFinite(lo)||!isFinite(hi)){lo=0;hi=1}if(lo===hi){const d=Math.abs(lo)*.1||1;lo-=d;hi+=d}
  const zero=lo>=0&&lo<=(hi-lo)*0.6; // 0과 가까우면 0에서 시작
  if(zero)lo=0;else{const pad=(hi-lo)*.08;lo-=pad}hi+=(hi-lo)*.06;
  const raw=(hi-lo)/(n-1),p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p,st=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;
  const a=Math.floor(lo/st)*st,b=Math.ceil(hi/st)*st;const ticks=[];for(let v=a;v<=b+st/2;v+=st)ticks.push(+v.toFixed(10));return {mn:a,mx:b,ticks,st,cut:a>0}}
function lines(el,cats,series,unit){
  // 앞뒤로 모든 계열이 빈 연도는 잘라 데이터가 있는 구간만 그림
  let i0=0,i1=cats.length-1;const has=i=>series.some(s=>s.v[i]!=null);while(i0<i1&&!has(i0))i0++;while(i1>i0&&!has(i1))i1--;
  if(i0>0||i1<cats.length-1){cats=cats.slice(i0,i1+1);series=series.map(s=>({...s,v:s.v.slice(i0,i1+1)}))}
  mount(el,(W,H)=>{if(!W)return;const L=52,R=70,T=12,B=26;const all=series.flatMap(s=>s.v).filter(v=>v!=null);
  const ax=niceAxis(Math.min(...all),Math.max(...all),W<520?4:6),mx=ax.mx,mn=ax.mn;const dd=ax.st<1?(ax.st<.1?2:1):0;
  const x=i=>L+(W-L-R)*(cats.length<2?.5:i/(cats.length-1)),y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));let g='';
  ax.ticks.forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="currentColor" opacity=".1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="currentColor" opacity=".6">${fmt(v,dd)}</text>`});
  if(ax.cut)g+=`<path d="M${L-4} ${H-B-2} l4 -4 l4 4" fill="none" stroke="currentColor" opacity=".45"/><text x="${L}" y="${T-2}" font-size="10" fill="currentColor" opacity=".55">축 ${fmt(mn,dd)}부터</text>`;
  const stp=Math.max(1,Math.ceil(cats.length*38/Math.max(1,W-L-R)));cats.forEach((c,i)=>{if(i%stp===0||i===cats.length-1)g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="currentColor" opacity=".75">${W<520?String(c).slice(2):c}</text>`});
  series.forEach(s=>{const p=s.v.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);g+=`<polyline points="${p.map(q=>q.join(',')).join(' ')}" fill="none" stroke="${s.c}" stroke-width="2.2"/>`;
   s.v.forEach((v,i)=>{if(v!=null)g+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${s.c}" data-t="${esc(cats[i]+' · '+s.n+': '+fmt(v)+unit)}"/>`});
});
  {const lab=series.map(s=>{const lv=s.v[s.v.length-1];return lv==null?null:{s,yy:y(lv)+4}}).filter(Boolean).sort((a,b)=>a.yy-b.yy);for(let i=1;i<lab.length;i++)if(lab[i].yy-lab[i-1].yy<13)lab[i].yy=lab[i-1].yy+13;for(let i=lab.length-1,lim=H-B-2;i>=0;i--){if(lab[i].yy>lim)lab[i].yy=lim;lim=lab[i].yy-13}
   lab.forEach(o=>{g+=`<text x="${x(cats.length-1)+6}" y="${o.yy}" font-size="11" fill="${o.s.c}" font-weight="700">${esc(String(o.s.n).slice(0,6))}</text>`})}
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;bindTip(el)})}
function bindTip(el){el.querySelectorAll('[data-t]').forEach(n=>{n.addEventListener('mousemove',e=>showTip(e,n.dataset.t));n.addEventListener('mouseleave',hideTip)})}
const legend=series=>`<div class="legend">${series.map(s=>`<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join('')}</div>`;
const hbars=(pairs,unit='',dd=0)=>{const mx=Math.max(1,...pairs.map(p=>p[1]));return `<div class="bars">${pairs.map(([k,v])=>`<div class="r"><span>${esc(k)}</span><span><b style="width:${v/mx*100}%"></b></span><span>${fmt(v,dd)}${unit}</span></div>`).join('')}</div>`};
function tableHTML(head,rows,opt={}){return `<div class="tw"><table class="t"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
function csv(head,rows){return [head,...rows].map(r=>r.map(c=>/[",\n]/.test(c)?`"${String(c).replace(/"/g,'""')}"`:c).join(',')).join('\n')}

function chips(){const c=[`기준 ${S.y}년`,`추이 ${S.per>50?'전체':'최근 '+S.per+'년'}`,S.unit==='inst'?'기관 단위':'캠퍼스 단위'];
 if(S.g.size)c.push([...S.g].join('·'));if(S.e.size)c.push([...S.e].join('·'));if(S.r.size)c.push([...S.r].join('·'));if(S.b.size)c.push([...S.b].join('·'));if(S.st&&S.st.size)c.push('상태: '+[...S.st].join('·'));if(S.s)c.push(S.s);if(S.q)c.push('“'+S.q+'”');
 $('#chips').innerHTML=c.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}

function vOverview(){
  const yrs=perYears(),cur=rowsY(S.y),prev=rowsY(S.y-1);const n=count(cur),np=count(prev);
  const by=groupCount(cur,'g',GORDER),bp=Object.fromEntries(groupCount(prev,'g',GORDER));
  const pub=groupCount(cur,'e',EORDER),nPub=pub.filter(p=>p[0]!=='사립').reduce((a,p)=>a+p[1],0);

  const kpi=(l,v,u,p)=>{const d=p==null?'':(v-p);return `<div class="kpi"><div class="l">${l}</div><div class="v">${fmt(v)}<small>${u}</small></div><div class="d ${d>0?'up':d<0?'dn':'flat'}">${p==null?'&nbsp;':'전년 대비 '+(d>0?'+':'')+fmt(d)}</div></div>`};

  const merges=D.EVL.filter(e=>yrs.includes(e.y)&&e.t==='통합').length,closes=D.EVL.filter(e=>yrs.includes(e.y)&&e.t==='폐교').length;
  $('#v-ov').innerHTML=`

  <div class="card"><h2>연도별 공시 대상 기관 수 <small>학교개황 각 연도 원자료, 폐교 제외</small></h2>${legend(ser)}<div class="fig" id="ch-ov"></div></div>
  <div class="grid2">
    <div class="card"><h2>${S.y}년 시도별 <small>${S.unit==='inst'?'기관':'캠퍼스'} 수</small></h2>${hbars(groupCount(cur,'sd').sort((a,b)=>b[1]-a[1]))}</div>
    <div class="card"><h2>${S.y}년 설립·학제별</h2>${hbars(pub)}<div style="height:10px"></div>${hbars(groupCount(cur,'hj').sort((a,b)=>b[1]-a[1]))}</div>
  </div>
  <div class="card"><h2>${S.y}년 특별법·직업능력개발법 설립 기관 <small>고등교육법 외 법률로 설립 · 학교명을 누르면 상세</small></h2>${tableHTML(['학교명','구분','학제','설립','소재지','설립 근거'],[...new Map(REC.filter(r=>r.y===S.y&&r.bs!=='고등교육법').map(r=>[r.ins,r])).values()].sort((a,b)=>GORDER.indexOf(a.g)-GORDER.indexOf(b.g)||a.ins.localeCompare(b.ins,'ko')).map(r=>`<tr><td><span class="uname" data-u="${esc(r.ins)}">${esc(r.ins)}</span></td><td>${r.g}</td><td>${esc(r.hj)}</td><td>${r.e}</td><td>${esc(r.sd)} · ${esc((D.AD[r.ins]||[''])[0].split(' ').slice(0,2).join(' '))}</td><td><span class="hb k-${r.bs}">${r.bs}</span> ${esc((D.AD[r.ins]||['',''])[1])}</td></tr>`))}<p class="note">한국농수산대학교는 「한국농수산대학교 설치법」에 따른 국립(특별법) 3년제 대학으로, 대학정보공시에서는 <b>전문대학</b>으로 분류되어 공시합니다(전북 전주). 왼쪽 ‘설립 근거 법률’에서 특별법을 고르면 이 기관들만 볼 수 있습니다.</p></div>
  <div class="card"><h2>최근 변동 <small>교명변경·통합·폐교·신설 (${yrs[0]}~${S.y})</small></h2><div class="tl">${[...yrs].reverse().map(y=>{const es=D.EVL.filter(e=>e.y===y&&passEv(e));return es.length?`<div class="y">${y}</div>`+es.map(e=>`<div><span class="hb k-${e.t}">${e.t}</span> <b>${esc(e.n)}</b> <span class="note">${esc(e.g)} · ${esc(e.r)}</span>${e.m?' → '+esc(e.m):''}</div>`).join(''):''}).join('')}</div></div>`;

function passEv(e){if(S.g.size&&!S.g.has(e.g))return false;if(S.q&&!(e.n+e.m).includes(S.q))return false;if(S.s&&e.r!==S.s)return false;return true}

let TRDIM='g';
function vTrendCnt(){

  const mat=keys.map(k=>yrs.map(y=>count(rowsY(y).filter(r=>r[TRDIM]===k))));const tot=yrs.map(y=>count(rowsY(y)));

  body.push(`<tr class="tot"><td>계</td>${tot.map(v=>`<td class="n">${fmt(v)}</td>`).join('')}<td class="n">${fmt(tot.at(-1)-tot[0])}</td><td class="n">${fmt(pct(tot.at(-1),tot[0]),1)}</td></tr>`);
  window._trcsv=csv(head,[...keys.map((k,i)=>[k,...mat[i]]),['계',...tot]]);
  $('#v-tr').innerHTML=`<div class="card"><h2>항목별 추이 <small>${yrs[0]}~${yrs.at(-1)} · ${S.unit==='inst'?'기관':'캠퍼스'} 수</small></h2>
  <div class="ctrl">${trMeasureSel()}<div class="fg"><label>구분 기준</label><select id="trdim">${Object.entries(dims).map(([k,v])=>`<option value="${k}" ${k===TRDIM?'selected':''}>${v[0]}</option>`).join('')}</select></div><button class="btn ghost sm" id="trcsv">⬇ 표 CSV</button></div>
  ${legend(ser)}<div class="fig" id="ch-tr"></div></div><div class="card"><h2>${lab}별 ${S.unit==='inst'?'기관':'캠퍼스'} 수</h2>${tableHTML(head,body)}</div>`;
  lines($('#ch-tr'),yrs,ser,'');
  $('#trdim').onchange=e=>{TRDIM=e.target.value;vTrend()};trMeasureBind();$('#trcsv').onclick=()=>saveFile(`추이분석_${TRM==='cnt'?'기관수':(SI&&SI.byK[TRM]?SI.byK[TRM].n.replace(/[\\/:*?"<>|()]/g,''):TRM)}.csv`,'\ufeff'+window._trcsv);
}

    g+=`<text x="${x0+bw+2}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="#222">${lab}${o.p!=null?' (전년·올해)':''}</text>`});

function statTable(st){const SD=SIDES();const sides=[SD.u&&[SD.uk==='U'?'4년제(대학·교육대학)':SD.ul,'U'],SD.j&&['전문대학','J'],SD.k&&['기능대학','K']].filter(Boolean);if(!sides.length)return '';

// ===== 보고서 분석: 3개년 추이·전년 대비 특이점·세부집단 격차·지표 간 비교 (HEDX 자체 집계)

function analyzeStat(s){const L=[];const sides=ANS();

  <tr><td>공식 대상 수와 차이</td><td class="w">교육부 발표 2026년 공시 대상은 403개교(대학 222, 전문대학 137, 대학원대학 44). 학교개황 원자료는 2.19. 기준으로 통합 직후 캠퍼스·각종학교를 포함해 대학 수가 몇 곳 더 많게 나옴</td></tr>
  <tr><td>변동 판정</td><td class="w">전년 공시 대상에서 빠진 학교를 같은 해 새 학교와 주소로 대조(교명변경), 교육부 보도자료로 통합·폐교 확인. 광양보건대학교 폐교(2026.8.31.)는 2026 학교개황 이후 변동이라 이력에만 반영</td></tr>
  <tr><td>공시항목</td><td class="w">한국대학교육협의회 「2026년 대학정보공시 지침서」(2026.3.10.) 월별 공시항목 표</td></tr>
  <tr><td>주요통계</td><td class="w"><b>HEDX 자체 집계(공시 원자료 기준)</b>: 공시 원자료 2024~2026년 표를 「2026년 대학정보공시 지침서」 산식으로 계산(비율 = Σ분자 ÷ Σ분모, 규모 = 합계). 교육부·대교협 「2026년 대학정보공시 분석 결과」 보도자료 값(4년제 192개교·전문대학 125개교)은 '대교협 분석보고서(참고)'에만 표시</td></tr>
  <tr><td>공시지표 분석</td><td class="w">대학알리미 ‘공시데이터 추이’의 학교별 지표 파일(대학·전문대학 각 42종, 2008~2026)에서 56개 지표를 뽑아 학교코드 기준으로 정리. 평균은 학교 단순평균이며, 같은 학교가 여러 행(본·분교 등)이면 비율은 평균·인원은 합계. 대학원대학은 이 자료에 없어 제외</td></tr>
  <tr><td>공시 원자료</td><td class="w">대학알리미 ‘분야별 공시항목’의 항목별 공시정보(전체 학교 표)를 2024~2026년·대학/전문대학/대학원대학/대학원별로 내려받아 변환. 다단 머리글은 ‘상위 &gt; 하위’로 이어 붙임. 미수집 표는 수집이 끝나는 대로 채움</td></tr>

  $('#f-scope').onchange=e=>{S.g.clear();e.target.value.split(',').filter(Boolean).forEach(g=>S.g.add(g));syncSide();LPAGE=0;render()};

  document.addEventListener('click',e=>{const u=e.target.closest('.uname');if(u)profile(u.dataset.u)});
  addEventListener('hashchange',()=>setTab(location.hash.slice(1)));
