<title>한국전문대학교육 30년사</title>
<meta name="theme-color" content="#14213d">
<style>
:root{
  --bar:#14213d; --bar2:#1d2d50; --ink:#f5f1e8; --accent:#e9a23b; --bg:#2b2f36;
  --paper:#fff; --muted:#9aa4b8; --drawer:#fbfaf7; --dink:#1f2430; --line:#e3ded3;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
/* top bar */
#top{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:6px;
  padding:calc(6px + var(--safe-t)) 10px 6px;background:var(--bar);box-shadow:0 2px 10px rgba(0,0,0,.3);
  transition:transform .25s}
#top .title{flex:1;min-width:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
#top .title small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:40px;height:40px;padding:0 9px;border-radius:10px;font-size:13px}
.ib:hover{background:rgba(255,255,255,.08)}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.seg{display:inline-flex;background:rgba(255,255,255,.08);border-radius:10px;padding:3px}
.seg button{height:34px;padding:0 11px;border-radius:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--accent);color:#1b1b1b;font-weight:700}
#tabs{flex-basis:100%;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 0 2px;margin:2px -10px -2px;padding-left:10px;padding-right:10px;
  border-top:1px solid rgba(255,255,255,.08);scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:none;height:34px;padding:0 14px;border-radius:17px;font-size:13.5px;color:#cfd6e6;background:rgba(255,255,255,.06);white-space:nowrap;transition:background .2s,color .2s}
#tabs button:hover{background:rgba(255,255,255,.14);color:#fff}
#tabs button.on{background:var(--ink);color:var(--bar);font-weight:800}
@media (max-width:640px){#tabs button{height:32px;padding:0 12px;font-size:13px}}
/* bottom bar */
#bot{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:8px 12px calc(8px + var(--safe-b));background:var(--bar);transition:transform .25s}
#slider{flex:1;accent-color:var(--accent);height:28px}
#pinfo{min-width:92px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink);
  background:rgba(255,255,255,.08);border-radius:8px;padding:6px 8px}
body.hidebars #top{transform:translateY(-110%)} body.hidebars #bot{transform:translateY(110%)}
/* stage */
#stage{position:fixed;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;
  overscroll-behavior:contain}
#book{display:flex;justify-content:center;align-items:center;margin:auto;min-height:100%;padding:var(--padT) 0 var(--padB);}
.page{position:relative;background:var(--paper);box-shadow:0 4px 18px rgba(0,0,0,.45);overflow:hidden;flex:none}
.page img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none;opacity:0;transition:opacity .2s}
.page img.ok{opacity:1}
.page.blank{background:#fdfcf9}
.page .ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:13px}
.flipwrap{flex:none;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
.page{box-shadow:none}
.page.even::after{content:"";position:absolute;top:0;right:0;bottom:0;width:7%;background:linear-gradient(90deg,transparent,rgba(0,0,0,.10));pointer-events:none}
.page.odd::after{content:"";position:absolute;top:0;left:0;bottom:0;width:7%;background:linear-gradient(270deg,transparent,rgba(0,0,0,.10));pointer-events:none}
.single .page::after{display:none}
#snd.off svg .w{display:none}
/* side arrows */
.nav{position:fixed;top:50%;z-index:10;transform:translateY(-50%);width:46px;height:84px;border-radius:12px;
  background:rgba(20,33,61,.55);display:flex;align-items:center;justify-content:center;opacity:.75}
.nav:hover{opacity:1;background:rgba(20,33,61,.85)}
.nav svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.5}
#prev{left:8px} #next{right:8px}
@media (hover:none){.nav{display:none}}
/* drawer */
#scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s}
#drawer{position:fixed;top:0;bottom:0;left:0;z-index:31;width:min(420px,90vw);background:var(--drawer);color:var(--dink);
  transform:translateX(-102%);transition:transform .28s;display:flex;flex-direction:column;box-shadow:4px 0 24px rgba(0,0,0,.3)}
body.toc #drawer{transform:none} body.toc #scrim{opacity:1;pointer-events:auto}
#dh{padding:calc(14px + var(--safe-t)) 16px 12px;background:var(--bar);color:var(--ink)}
#dh h2{margin:0 0 10px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
#q{width:100%;height:40px;border-radius:10px;border:0;padding:0 12px;font-size:15px;background:#fff;color:#222}
#toclist{flex:1;overflow:auto;padding:6px 0 calc(20px + var(--safe-b));-webkit-overflow-scrolling:touch}
.t{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;padding:11px 18px;border-bottom:1px solid var(--line);font-size:15px;line-height:1.4}
.t:hover{background:#f1ede4}
.t .n{margin-left:auto;color:#8a8576;font-size:13px;font-variant-numeric:tabular-nums;flex:none}
.t.l0{background:var(--bar2);color:#fff;font-weight:800;font-size:16.5px;padding:15px 18px;border-bottom:0;margin-top:8px}
.t.l0 .n{color:#c9d2e6}
.t.l0:hover{background:#26396a}
.t.l1{font-weight:700;padding-left:22px;color:#14213d}
.t.l2{padding-left:40px;font-size:14px;color:#3a3f4b}
.t.cur{box-shadow:inset 4px 0 0 var(--accent);background:#fff4df}
.t.l0.cur{background:#26396a}
.empty{padding:30px;text-align:center;color:#888}
/* goto dialog */
#gd{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
#gd.on{display:flex}
#gd form{background:#fff;color:#222;border-radius:14px;padding:20px;width:min(320px,88vw)}
#gd h3{margin:0 0 4px;font-size:17px} #gd p{margin:0 0 12px;font-size:13px;color:#666}
#gd input{width:100%;height:44px;font-size:18px;border:1px solid #ccc;border-radius:10px;padding:0 12px}
#gd .r{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
#gd .r button{height:40px;padding:0 16px;border-radius:10px;background:#eee}
#gd .r button.p{background:var(--bar);color:#fff}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:50;background:rgba(0,0,0,.8);color:#fff;
  padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
@media (max-width:640px){
  .hide-s{display:none!important}
  #top .title{font-size:14px}
  .seg button{padding:0 9px}
}
</style>
<div id="stage"><div id="book"></div></div>

<header id="top">
  <button class="ib" id="btnToc" title="목차 (T)" aria-label="목차"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="hide-s">목차</span></button>
  <div class="title">한국전문대학교육 30년사<small id="sect"></small></div>
  <div class="seg" role="group" aria-label="보기 방식">
    <button id="m1" title="한쪽 보기 (1)">한쪽</button><button id="m2" title="양쪽 보기 (2)">양쪽</button>
  </div>
  <div class="seg hide-s" id="fitseg" role="group" aria-label="맞춤">
    <button id="fP" title="쪽 맞춤">쪽맞춤</button><button id="fW" title="폭 맞춤">폭맞춤</button>
  </div>
  <button class="ib hide-s" id="zo" title="축소 (-)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M21 21l-5-5"/></svg></button>
  <button class="ib hide-s" id="zi" title="확대 (+)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M11 8v6M21 21l-5-5"/></svg></button>
  <button class="ib" id="snd" title="넘김 소리 켜기/끄기"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="w" d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></svg></button>
  <button class="ib" id="fs" title="전체화면 (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <nav id="tabs" aria-label="바로가기"></nav>
</header>

<button class="nav" id="prev" aria-label="이전 쪽"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="nav" id="next" aria-label="다음 쪽"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>

<footer id="bot">
  <button class="ib" id="bFirst" title="처음"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 5l-7 7 7 7"/></svg></button>
  <input type="range" id="slider" min="0" value="0" aria-label="쪽 이동">
  <button id="pinfo" title="쪽 번호로 이동">-</button>
  <button class="ib" id="bLast" title="끝"><svg viewBox="0 0 24 24"><path d="M18 5v14M6 5l7 7-7 7"/></svg></button>
</footer>

<div id="scrim"></div>
<aside id="drawer" aria-label="목차">
  <div id="dh"><h2>목차 <button class="ib" id="dclose" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h2>
  <input id="q" type="search" placeholder="목차 검색 (예: 산학협력)"></div>
  <nav id="toclist"></nav>
</aside>

<div id="gd"><form id="gform"><h3>쪽 이동</h3><p id="gdhint">책에 인쇄된 쪽 번호를 입력하세요</p>
<input id="gin" inputmode="numeric" autocomplete="off"><div class="r"><button type="button" id="gcancel">취소</button><button class="p">이동</button></div></form></div>

const CH=8, CHUNKS={};
function chunk(c){ return CHUNKS[c]||(CHUNKS[c]=fetch('p/c'+String(c).padStart(3,'0')+'.json').then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }).catch(e=>{ delete CHUNKS[c]; throw e; })); }
const srcOf=i=>{const p=P[i]; if(p.b) return Promise.resolve(null); return chunk(Math.floor(p.k/CH)).then(a=>'data:image/webp;base64,'+a[p.k%CH]);};
const touchDev=matchMedia('(hover:none)').matches;

let mode=+(store.get('mode') || (innerWidth>=900 && innerWidth>innerHeight ? 2 : 1));
let fit=store.get('fit') || (innerWidth<640 ? 'W':'P');
let zoom=1, sound=store.get('snd')!=='0';
let cur=Math.min(N-1,Math.max(0,+(store.get('pos')||0)));   // index into P
let pf=null, L=[], wrap=null, pageW=0;

/* ---------- page-turn sound (synthesised, no file) ---------- */
let actx=null;
function flipSound(){
  if(!sound) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const d=0.32, n=Math.floor(actx.sampleRate*d), buf=actx.createBuffer(1,n,actx.sampleRate), ch=buf.getChannelData(0);
    for(let i=0;i<n;i++){ const x=i/n; ch[i]=(Math.random()*2-1)*Math.pow(1-x,2.2)*Math.min(1,x*18)*(0.6+0.4*Math.sin(x*40)); }
    const s=actx.createBufferSource(); s.buffer=buf;
    const f=actx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2600; f.Q.value=0.6;
    const g=actx.createGain(); g.gain.value=0.22;
    s.connect(f); f.connect(g); g.connect(actx.destination); s.start();
  }catch(e){}
}

/* ---------- geometry ---------- */
function bars(){ const hidden=body.classList.contains('hidebars'); return [hidden?8:$('#top').offsetHeight+8, hidden?8:$('#bot').offsetHeight+8]; }
function calcW(){
  const [padT,padB]=bars();
  bookEl.style.setProperty('--padT',padT+'px'); bookEl.style.setProperty('--padB',padB+'px');
  const side=touchDev?6:64;
  const availW=stage.clientWidth-side*2, availH=stage.clientHeight-padT-padB;
  const cols=mode===2?2:1;
  let w=(fit==='W'&&mode===1)? Math.min(availW,1100) : Math.min(availW/cols, availH/BOOK.ar);
  return Math.floor(w*zoom);
}

/* ---------- build flip book ---------- */
function pageEl(i){
  const p=P[i], d=document.createElement('div');
  d.className='page'+(p.b?' blank':'')+(((i+1)%2===0)?' even':' odd');
  if(i===0||i===N-1) d.dataset.density='hard';
  if(!p.b){
    const ld=document.createElement('div'); ld.className='ld'; ld.textContent='불러오는 중…'; d.appendChild(ld);
    const im=document.createElement('img'); im.alt=(p.l?p.l+'쪽':'')+' 페이지'; im.dataset.i=i; im.draggable=false; d.appendChild(im);
  }
  return d;
}
function lazy(){
  if(!wrap) return;
  const k=L.indexOf(cur), want=new Set();
  for(let j=k-3;j<=k+5;j++) if(j>=0&&j<L.length) want.add(L[j]);
  wrap.querySelectorAll('img[data-i]').forEach(im=>{
    const i=+im.dataset.i;
    if(want.has(i) && !im.getAttribute('src') && !im.dataset.req){
      im.onload=()=>{ im.classList.add('ok'); const l=im.parentNode&&im.parentNode.querySelector('.ld'); if(l) l.remove(); };
      im.dataset.req='1';
      srcOf(i).then(u=>{ if(u) im.src=u; }).catch(()=>{ delete im.dataset.req; const l=im.parentNode&&im.parentNode.querySelector('.ld'); if(l) l.textContent='불러오지 못했습니다 · 다시 넘겨 보세요'; });
    }
  });
}
function build(){
  if(pf){ try{pf.destroy();}catch(e){} pf=null; }
  bookEl.innerHTML='';
  if(mode===1 && P[cur].b){ let j=cur; while(j<N&&P[j].b) j++; cur=j<N?j:cur; }
  L = mode===2 ? P.map((_,i)=>i) : P.map((p,i)=>p.b?-1:i).filter(i=>i>=0);
  pageW=calcW(); const h=Math.round(pageW*BOOK.ar);
  const cols=mode===2?2:1;
  bookEl.className = mode===2?'spread':'single';
  wrap=document.createElement('div'); wrap.className='flipwrap';
  wrap.style.width=(pageW*cols)+'px'; wrap.style.height=h+'px';
  const root=document.createElement('div'); wrap.appendChild(root);
  bookEl.appendChild(wrap);
  bookEl.style.width=Math.max(stage.clientWidth, pageW*cols+2)+'px';
  const els=L.map(pageEl);
  let start=Math.max(0,L.indexOf(cur));
  pf=new St.PageFlip(root,{
    width:pageW, height:h, size:'fixed', autoSize:false,
    showCover:true, usePortrait:mode===1, startPage:start,
    drawShadow:true, maxShadowOpacity:0.45, flippingTime:750,
    mobileScrollSupport:true, useMouseEvents:zoom<=1.001, disableFlipByClick:true,
    showPageCorners:!touchDev, swipeDistance:25
  });
  pf.loadFromHTML(els);
  pf.on('flip',e=>{ cur=L[e.data]; after(); });
  pf.on('changeState',e=>{ if(e.data==='flipping') flipSound(); });
  stage.scrollTop=0; stage.scrollLeft=Math.max(0,(stage.scrollWidth-stage.clientWidth)/2);
  after();
}
function after(){ lazy(); updateUI(); store.set('pos',cur); }

/* ---------- navigation ---------- */
function spreadOf(i){ if(i===0) return [-1,0]; const l=(i%2===1)?i:i-1; return [l, l+1<N?l+1:-1]; }
function step(d){
  if(!pf) return;
  const k=pf.getCurrentPageIndex(), cnt=pf.getPageCount();
  if((d>0 && k>=cnt-1) || (d<0 && k<=0) || (d>0&&mode===2&&spreadOf(cur)[1]>=N-1)){ toast(d>0?'마지막 쪽입니다':'첫 쪽입니다'); return; }
  if(zoom>1){ // zoomed: no animation, keep reading position simple
    pf.turnToPage(Math.max(0,Math.min(cnt-1, k+(mode===2? (d>0?2:-2):d)))); cur=L[pf.getCurrentPageIndex()]; after(); flipSound(); return; }
  d>0? pf.flipNext('top') : pf.flipPrev('top');
}
function go(i,animate){
  if(!pf) return;
  i=Math.max(0,Math.min(N-1,i));
  if(mode===1 && P[i].b){ while(i<N-1&&P[i].b) i++; }
  const k=L.indexOf(i); if(k<0) return;
  if(animate && zoom<=1.001 && Math.abs(k-pf.getCurrentPageIndex())>0){ pf.flip(k,'top'); }
  else { pf.turnToPage(k); cur=i; after(); }
}

/* ---------- UI state ---------- */
function labelOf(i){ const p=P[i]; return p&&p.l?p.l:''; }
function sectionOf(i){ let s=null; for(const t of BOOK.toc){ if(t.v<=i) s=t; else break; } return s; }
function updateUI(){
  let txt;
  if(mode===2){ const a=spreadOf(cur).filter(x=>x>=0&&!P[x].b).map(labelOf).filter(Boolean); txt=a.length?a.join('–'):'빈 쪽'; }
  else txt=labelOf(cur)||'—';
  $('#pinfo').textContent=txt+' / '+BOOK.lastLabel;
  $('#slider').max=N-1; $('#slider').value=cur;
  $('#m1').classList.toggle('on',mode===1); $('#m2').classList.toggle('on',mode===2);
  $('#fP').classList.toggle('on',fit==='P'); $('#fW').classList.toggle('on',fit==='W');
  $('#fitseg').style.opacity=mode===1?1:.35;
  $('#snd').classList.toggle('off',!sound);
  let p0=null,p1=null; const vis=mode===2?Math.max(...spreadOf(cur)):cur; for(const t of BOOK.toc){ if(t.v>vis) break; if(t.lv===0){p0=t;p1=null;} else if(t.lv===1) p1=t; }
  $('#sect').textContent=[p0&&p0.t,p1&&p1.t].filter(Boolean).join(' · ');
  markToc(); markTabs();
}

/* ---------- quick tabs ---------- */
const tabsEl=$('#tabs');
(BOOK.tabs||[]).forEach((t,ix)=>{ const b=document.createElement('button'); b.textContent=t.t; b.dataset.ix=ix; b.onclick=()=>go(t.v,true); tabsEl.appendChild(b); });
function markTabs(){
  const vis=mode===2?Math.max(...spreadOf(cur)):cur; let on=-1; (BOOK.tabs||[]).forEach((t,ix)=>{ if(t.v<=vis) on=ix; });
  tabsEl.querySelectorAll('button').forEach(b=>{ const a=+b.dataset.ix===on; if(a&&!b.classList.contains('on')){ b.classList.add('on'); b.scrollIntoView({inline:'center',block:'nearest'}); } else if(!a) b.classList.remove('on'); });
}
/* ---------- TOC ---------- */
const tocEl=$('#toclist');
function buildToc(q){
  tocEl.innerHTML=''; q=(q||'').trim().replace(/\s+/g,''); let n=0;
  BOOK.toc.forEach((t,ix)=>{
    if(q && !t.t.replace(/\s+/g,'').includes(q)) return;
    const b=document.createElement('button'); b.className='t l'+t.lv; b.dataset.ix=ix;
    b.innerHTML='<span></span><span class="n"></span>'; b.firstChild.textContent=t.t; b.lastChild.textContent=t.l||'';
    b.onclick=()=>{ closeToc(); setTimeout(()=>go(t.v,true),260); };
    tocEl.appendChild(b); n++;
  });
  if(!n) tocEl.innerHTML='<div class="empty">검색 결과가 없습니다</div>';
  markToc();
}
function markToc(){ const s=sectionOf(cur); tocEl.querySelectorAll('.t.cur').forEach(e=>e.classList.remove('cur'));
  if(!s) return; const el=tocEl.querySelector('[data-ix="'+BOOK.toc.indexOf(s)+'"]'); if(el) el.classList.add('cur'); }
function openToc(){ body.classList.add('toc'); const c=tocEl.querySelector('.cur'); if(c) c.scrollIntoView({block:'center'}); }
function closeToc(){ body.classList.remove('toc'); }
$('#btnToc').onclick=openToc; $('#scrim').onclick=closeToc; $('#dclose').onclick=closeToc;
$('#q').oninput=e=>buildToc(e.target.value);

/* ---------- controls ---------- */
$('#m1').onclick=()=>{ if(mode===1) return; mode=1; zoom=1; store.set('mode',1); build(); };
$('#m2').onclick=()=>{ if(mode===2) return; mode=2; zoom=1; store.set('mode',2); build(); };
$('#fP').onclick=()=>{ fit='P'; zoom=1; store.set('fit','P'); build(); };
$('#fW').onclick=()=>{ fit='W'; zoom=1; store.set('fit','W'); build(); };
function setZoom(z){ z=Math.max(1,Math.min(4,z)); if(Math.abs(z-zoom)<0.01) return; zoom=z; build(); toast(Math.round(zoom*100)+'%'); }
$('#zi').onclick=()=>setZoom(zoom*1.25); $('#zo').onclick=()=>setZoom(zoom/1.25);
$('#prev').onclick=()=>step(-1); $('#next').onclick=()=>step(1);
$('#bFirst').onclick=()=>go(0); $('#bLast').onclick=()=>go(N-1);
$('#snd').onclick=()=>{ sound=!sound; store.set('snd',sound?'1':'0'); updateUI(); toast(sound?'넘김 소리 켜짐':'넘김 소리 꺼짐'); if(sound) flipSound(); };
$('#slider').oninput=e=>{ const l=labelOf(+e.target.value); $('#pinfo').textContent=(l||'—')+' / '+BOOK.lastLabel; };
$('#slider').onchange=e=>go(+e.target.value);
$('#fs').onclick=()=>{ const d=document; if(!d.fullscreenElement){ (d.documentElement.requestFullscreen||d.documentElement.webkitRequestFullscreen||function(){}).call(d.documentElement);} else d.exitFullscreen(); };
const gd=$('#gd');
$('#pinfo').onclick=()=>{ gd.classList.add('on'); $('#gin').value=''; setTimeout(()=>$('#gin').focus(),50); };
$('#gcancel').onclick=()=>gd.classList.remove('on');
$('#gform').onsubmit=e=>{ e.preventDefault(); const v=$('#gin').value.trim(); gd.classList.remove('on');
  let k=P.findIndex(p=>p.l&&p.l===v);
  if(k<0&&/^\d+$/.test(v)){ const n=+v; let best=-1,bd=1e9; P.forEach((p,i)=>{ if(/^\d+$/.test(p.l||'')&&Math.abs(+p.l-n)<bd){bd=Math.abs(+p.l-n);best=i;} }); k=best; }
  if(k>=0) go(k,true); else toast('해당 쪽을 찾을 수 없습니다'); };
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('on'),1300); }

addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'){ if(e.key==='Escape'){closeToc();gd.classList.remove('on');} return; }
  const k=e.key;
  if(k==='ArrowRight'||k==='PageDown'){ e.preventDefault(); step(1); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); step(-1); }
  else if(k==='Home') go(0); else if(k==='End') go(N-1);
  else if(k==='t'||k==='T') body.classList.contains('toc')?closeToc():openToc();
  else if(k==='1') $('#m1').click(); else if(k==='2') $('#m2').click();
  else if(k==='+'||k==='=') setZoom(zoom*1.25); else if(k==='-') setZoom(zoom/1.25);
  else if(k==='f'||k==='F') $('#fs').click(); else if(k==='m'||k==='M') $('#snd').click();
  else if(k==='Escape'){ closeToc(); gd.classList.remove('on'); }
});
stage.addEventListener('wheel',e=>{ if(e.ctrlKey){ e.preventDefault(); setZoom(zoom*(e.deltaY<0?1.15:1/1.15)); } },{passive:false});

/* ---------- taps / clicks (drag & swipe flipping is handled by the flip engine) ---------- */
let down=null, lastTap=0, tapH=0, pinch=null;
function tapAt(x){
  const W=innerWidth;
  if(x<W*0.2) step(-1); else if(x>W*0.8) step(1);
  else { body.classList.toggle('hidebars'); }
}
stage.addEventListener('pointerdown',e=>{ down={x:e.clientX,y:e.clientY,t:Date.now()}; });
stage.addEventListener('pointerup',e=>{
  if(!down||pinch) return; const dx=e.clientX-down.x, dy=e.clientY-down.y, dt=Date.now()-down.t; const d0=down; down=null;
  if(Math.hypot(dx,dy)>8||dt>400) {
    // zoomed in: swipe at scroll edge turns page
    if(zoom>1 && Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){
      const atL=stage.scrollLeft<=2, atR=stage.scrollLeft+stage.clientWidth>=stage.scrollWidth-2;
      if((dx<0&&atR)||(dx>0&&atL)) step(dx<0?1:-1);
    }
    return;
  }
  if(e.target.closest('#prev,#next')) return;
  const now=Date.now();
  if(touchDev){
    if(now-lastTap<300){ lastTap=0; clearTimeout(tapH); setZoom(zoom>1?1:2); return; }
    lastTap=now; const x=e.clientX; tapH=setTimeout(()=>tapAt(x),300);
  } else {
    if(e.target.closest('.page')){ if(e.clientX<innerWidth/2) step(-1); else step(1); }
  }
});
stage.addEventListener('dblclick',e=>{ if(!touchDev){ e.preventDefault(); } });
/* pinch zoom (touch) */
stage.addEventListener('touchstart',e=>{ if(e.touches.length===2){ const [a,b]=e.touches; pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),z:zoom,last:zoom}; } },{passive:true});
stage.addEventListener('touchmove',e=>{ if(pinch&&e.touches.length===2){ e.preventDefault(); const [a,b]=e.touches;
  pinch.last=Math.max(1,Math.min(4,pinch.z*Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/pinch.d));
  if(wrap){ wrap.style.transform='scale('+(pinch.last/zoom)+')'; wrap.style.transformOrigin='center top'; } } },{passive:false});
stage.addEventListener('touchend',e=>{ if(pinch&&e.touches.length<2){ const z=pinch.last; pinch=null; if(wrap) wrap.style.transform=''; setZoom(z); } });

let rz, lastW=innerWidth, lastH=innerHeight;
addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(Math.abs(innerWidth-lastW)<2&&Math.abs(innerHeight-lastH)<80) return; lastW=innerWidth; lastH=innerHeight; build(); },150); });
document.addEventListener('fullscreenchange',()=>setTimeout(build,120));
const _tog=body.classList.toggle.bind(body.classList);
new MutationObserver(()=>{}).observe(body,{attributes:true});
buildToc(); build();
})();
</script>

</body></html>
