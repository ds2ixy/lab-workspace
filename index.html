<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<style id="css">
:root{
  --bg:#f4f5f2; --panel:#ffffff; --ink:#1d2124; --ink2:#5b6268; --ink3:#8d949a; --line:#e3e5e0;
  --side:#16202b; --side2:#1f2b38; --sideInk:#c9d2db; --sideInk2:#7f8c99; --accent:#e0a43a;
  --ok:#2f8f5b; --warn:#c7801c; --bad:#b9483a; --info:#3b6fb6; --mute:#8a9096;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"IBM Plex Sans KR",system-ui,sans-serif;background:#e7e9e4;color:var(--ink);font-size:14px;line-height:1.55}
.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh;max-width:1480px;margin:0 auto;background:var(--bg);box-shadow:0 0 0 1px #dfe2dc,0 10px 40px rgba(20,30,40,.06)}
html{background:#e7e9e4}
/* sidebar */
.side{background:var(--side);color:var(--sideInk);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:22px 20px 18px;border-bottom:1px solid #263342}
.brand .k{font-size:11px;letter-spacing:.14em;color:var(--accent);font-weight:600}
.brand .t{font-size:17px;font-weight:700;color:#fff;margin-top:4px}
.nav{padding:12px 10px;flex:1;overflow:auto}
.nav .sec{font-size:11px;color:var(--sideInk2);letter-spacing:.08em;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--sideInk);margin-bottom:2px}
.nav a:hover{background:var(--side2)}
.nav a.on{background:#2a3a4b;color:#fff}
.nav .dot{width:8px;height:8px;border-radius:50%;flex:none}
.nav .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .pct{font-size:11px;color:var(--sideInk2)}
.nav a.on .pct{color:#d8e0e8}
.sidefoot{padding:14px 20px;border-top:1px solid #263342;font-size:12px;color:var(--sideInk2)}
.sidefoot .save{display:flex;align-items:center;gap:6px}
.sidefoot .save i{width:7px;height:7px;border-radius:50%;background:var(--mute);display:inline-block}
.sidefoot .save.ok i{background:#4fbf7f}.sidefoot .save.busy i{background:var(--accent)}.sidefoot .save.ro i{background:#d06b5c}
.btn.menuBtn{display:none}
.main{min-width:0}.cols>*,.stack>*{min-width:0}.addrow select{flex:none}
/* main */
.main{padding:28px 40px 60px;max-width:1232px;width:100%;margin:0 auto;justify-self:center}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-.01em}
.top .sub{color:var(--ink2);margin-top:4px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#c8ccc5}
.btn.pri{background:var(--side);color:#fff;border-color:var(--side)}
.btn.pri:hover{background:#24323f}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink3)}
.btn.ghost:hover{color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.card h3{margin:0 0 12px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi .l{font-size:12px;color:var(--ink2)}
.kpi .v{font-size:26px;font-weight:600;margin-top:2px}
.kpi .v small{font-size:13px;color:var(--ink3);font-weight:500;margin-left:3px}
/* project cards on home */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.pcard{cursor:pointer;transition:border-color .15s, transform .15s;position:relative;overflow:hidden}
.pcard:hover{border-color:#bfc4bc;transform:translateY(-1px)}
.pcard .bar0{position:absolute;left:0;top:0;bottom:0;width:4px}
.pcard .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pcard .grp{font-size:11px;color:var(--ink3);letter-spacing:.06em}
.pcard .nm{font-size:16px;font-weight:600;margin-top:2px}
.pcard .meta{display:flex;gap:14px;color:var(--ink2);font-size:12px;margin-top:12px}
.pcard .last{margin-top:10px;font-size:13px;color:var(--ink2);border-top:1px dashed var(--line);padding-top:10px;min-height:42px}
.pcard .last b{color:var(--ink);font-weight:500}
.badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap;border:1px solid currentColor}
.prog{height:6px;background:#eceee9;border-radius:6px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;border-radius:6px}
.progRow{display:flex;align-items:center;gap:10px}
.progRow .prog{flex:1;margin:0}
/* project view */
.phead{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.phead .grp{font-size:12px;color:var(--ink3);letter-spacing:.06em}
.phead h1{margin:2px 0 4px;font-size:24px}
.phead .desc{color:var(--ink2);max-width:640px}
.links{display:flex;gap:8px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#fff}
.bigpct{font-size:26px;font-weight:600}
.tasks{list-style:none;margin:0;padding:0}
.tasks li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0f1ee}
.tasks li:last-child{border-bottom:0}
.tasks input[type=checkbox]{width:16px;height:16px;accent-color:var(--side);flex:none;cursor:pointer}
.tasks .tx{flex:1}
.tasks li.done .tx{color:var(--ink3);text-decoration:line-through}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input,.addrow select{border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#fff}
.addrow input{flex:1;min-width:0}
.logs{list-style:none;margin:0;padding:0}
.logs li{display:grid;grid-template-columns:76px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid #f0f1ee;align-items:start}
.logs li:last-child{border-bottom:0}
.logs .d{font-size:12px;color:var(--ink3);padding-top:2px}
.logs .ty{font-size:11px;font-weight:600;margin-right:6px}
.empty{color:var(--ink3);font-size:13px;padding:8px 0}
.linkList{list-style:none;margin:0;padding:0}
.linkList li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f0f1ee}
.linkList li:last-child{border-bottom:0}
.linkList a{flex:1;text-decoration:none;font-weight:500}
.linkList a:hover{text-decoration:underline}
.linkList .note{font-size:12px;color:var(--ink3)}
.memo{width:100%;min-height:90px;border:1px solid var(--line);border-radius:7px;padding:9px;resize:vertical;background:#fff}
.stack{display:flex;flex-direction:column;gap:14px}
.feed li{grid-template-columns:76px 150px 1fr}
/* modal */
.modal{position:fixed;inset:0;background:rgba(18,24,30,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:12px;width:min(720px,100%);max-height:90vh;display:flex;flex-direction:column;padding:20px}
.modal textarea{flex:1;min-height:380px;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:13px;line-height:1.7;resize:vertical}
.modal .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--side);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.on{opacity:1}

/* 규정 질의응답 */
.nav .reg-ico{width:8px;height:8px;border-radius:2px;flex:none}
.regAsk{margin-bottom:14px}
.regDl{display:flex;gap:8px;flex-wrap:wrap}
.dlBtn{display:flex;align-items:center;gap:10px;border:1px solid #c9d6ea;background:#f3f7fd;border-radius:10px;padding:8px 14px 8px 10px;cursor:pointer;text-align:left;transition:background .15s,border-color .15s}
.dlBtn:hover{background:#e6eef8;border-color:#9fb4d6}
.dlBtn:disabled{opacity:.6;cursor:wait}
.dlIc{width:28px;height:28px;border-radius:8px;background:#3b6fb6;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.dlT{display:flex;flex-direction:column;line-height:1.25}.dlT b{font-size:13px;color:var(--ink)}.dlT small{font-size:11px;color:var(--ink3)}
.regForm textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-size:15px;resize:vertical;background:#fff;min-height:56px}
.regForm textarea:focus{outline:2px solid #c9d6ea;border-color:#9fb4d6}
.regBar{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px;flex-wrap:wrap}
.regScope{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px;cursor:pointer}
.regEx{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{border:1px solid var(--line);background:#fafbf8;border-radius:20px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.chip:hover{border-color:#bfc4bc;color:var(--ink)}
.regEmpty{color:var(--ink3);padding:18px 4px;font-size:14px}
.regMeta{font-size:13px;color:var(--ink2);margin:4px 2px 10px}
.regMeta .kw{display:inline-block;background:#fff3b0;border-radius:4px;padding:0 6px;margin-right:2px;color:var(--ink)}
.regSum{margin-bottom:12px;border-color:#e6d48a;background:#fffdf4}
.regSum h3{margin-bottom:8px}
.regSumNote{font-size:12px;color:var(--ink3);font-weight:500}
#regAi{font-size:14px;line-height:1.75;margin-bottom:6px}
#regAi .aiL{font-weight:600;margin-bottom:4px}
#regAi .aiB{padding-left:4px}
.regExt{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--ink2);line-height:1.7;border-top:1px dashed #e8dfb5;padding-top:8px}
.regRef{color:#3b6fb6;text-decoration:none;font-weight:600}
.regRef:hover{text-decoration:underline}
.regHit{margin-bottom:10px}
.regHit .rh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.regHit .rn{width:22px;height:22px;border-radius:50%;background:#eef0ec;font-size:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2)}
.regHit .rb{font-size:11px;font-weight:600;border-radius:4px;padding:1px 7px}
.regHit .rp{margin-left:auto;font-size:12px;color:var(--ink3)}
.regHit .rt{white-space:pre-wrap;font-size:14px;line-height:1.75;color:#2b3034}
.regHit.flash{box-shadow:0 0 0 3px #f3dc6b}
mark{background:#fff176;color:inherit;padding:0 1px;border-radius:2px;box-shadow:0 0 0 1px #fff176}
.btn.ghost2{border-color:transparent;background:transparent;color:#3b6fb6;padding-left:0;margin-top:4px}
.rImgs{display:flex;flex-direction:column;gap:10px;margin:2px 0 10px}
.rImgs figure{margin:0;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff;overflow:auto;max-height:520px}
.rImgs figure.zoom{max-height:none}
.rImgs img{display:block;max-width:100%;height:auto;cursor:zoom-in;margin:0 auto}
.rImgs figure.zoom img{max-width:none;cursor:zoom-out}
.rImgs figcaption{font-size:11.5px;color:var(--ink3);margin-top:6px;text-align:right}
.regMore summary{cursor:pointer;color:var(--ink2);font-size:13px;margin:8px 2px 10px}
/* 런치보드 현황판 */
.lb{margin-bottom:14px;padding:18px 20px 20px;--lg:#0E6B57;--lgs:#DDEFE8;--dk:#9A5A16}
.lbHead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
.lbTitle{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lbName{font-size:20px;font-weight:700}
.lbDot{width:7px;height:7px;border-radius:50%;background:var(--lg)}
.lbAt{font-size:12px;color:var(--ink2)}
.lbRo{font-size:11.5px;background:#eceee9;border-radius:6px;padding:2px 8px;color:var(--ink2)}
.lbRight{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.phead .lbLinks{align-self:flex-end;margin-bottom:2px}
.lbLedger{padding:8px 16px 8px 13px!important;font-size:14px!important}
.lbLedger{display:inline-flex;align-items:center;gap:7px;text-decoration:none;font-size:13px;font-weight:600;color:#0E6B57;background:#DDEFE8;border:1px solid #bfe0d4;border-radius:20px;padding:5px 12px 5px 10px;transition:background .15s}
.lbLedger:hover{background:#cde8de}
.lbLedger .ic{font-size:13px}
.lbLedger .tag{font-size:10.5px;font-weight:600;background:#0E6B57;color:#fff;border-radius:10px;padding:1px 7px}
.lbLedger .ar{font-size:12px;opacity:.7}
.lbMonth{display:flex;align-items:center;gap:10px}
.lbArrow{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:18px;line-height:1}
.lbYm{font-size:18px;font-weight:700;min-width:118px;text-align:center}
.lbTabs{display:flex;gap:4px;margin:12px 0 8px;flex-wrap:wrap}
.lbTab{border:0;background:transparent;padding:7px 14px;border-radius:20px;cursor:pointer;color:var(--ink2);font-weight:500}
.lbTab.on{background:#17201C;color:#fff}
.lbTeams{display:flex;gap:6px;align-items:center;margin-bottom:12px}
.lbTl{font-size:12px;color:var(--ink3);margin-right:2px}
.lbChip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 12px;cursor:pointer;font-size:12.5px}
.lbChip b{font-weight:600;color:var(--ink3)}
.lbChip.on{background:var(--lg);border-color:var(--lg);color:#fff}.lbChip.on b{color:#cfe8df}
.lbChip.sm{padding:2px 10px;margin-left:4px}
.lbSecHead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:6px 0 8px;flex-wrap:wrap}
.lbSecHead h4{margin:0;font-size:15px}
.lbHint{font-size:12px;color:var(--ink3);margin:0}
.lbTw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.lbT{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.lbT th,.lbT td{padding:8px 12px;text-align:right;border-bottom:1px solid #edf0ec;white-space:nowrap}
.lbT .l{text-align:left}
.lbT thead th{background:#eef1ed;font-weight:500;color:var(--ink2);font-size:12px}
.lbT tbody tr[data-act]{cursor:pointer}
.lbT tbody tr[data-act]:hover{background:#f6f8f5}
.lbT tr.sel{background:var(--lgs)!important}
.lbT tfoot th,.lbT tfoot td{background:#eef1ed;font-weight:700;border-bottom:0}
.lbT .neg{color:#B3261E}
.lbDaily th.l{white-space:normal;min-width:150px}.lbDaily th.we{color:#A14B4B}
.lbPlace{font-size:11px;color:var(--ink3);font-weight:400}
.lbZ{color:#c9cec8}
.lbYear td.heat{background:rgba(14,107,87,calc(var(--h)*.28))}
.lbGrid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.lbBox{border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.lbIt{display:flex;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid #f0f1ee}.lbIt:last-child{border-bottom:0}
.lbIt .grow{flex:1}.lbMuted{color:var(--ink3)}
.lbSlip{border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:#fff}
.lbSlip h4{text-align:center;margin:0;font-size:16px}.lbSlip .lbMeta{text-align:center;font-size:12px;color:var(--ink3);margin-top:4px}
.lbSlip hr{border:0;border-top:1px dashed var(--line);margin:10px 0}
.lbSlip table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.lbSlip th,.lbSlip td{padding:6px 4px;text-align:right}.lbSlip .l{text-align:left}
.lbSlip thead th{background:#eef1ed;font-weight:500;font-size:12px}
.lbSub{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2)}
.lbGrand{display:flex;justify-content:space-between;font-weight:700;font-size:16px;margin-top:8px}
.lbKpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.lbKpi{border:1px solid var(--line);border-radius:10px;padding:12px 14px}.lbKpi .l{font-size:12px;color:var(--ink2)}.lbKpi .v{font-size:20px;font-weight:700;margin-top:2px}.lbKpi small{font-size:12px;color:var(--ink3);margin-left:2px;font-weight:500}
.lbBars{display:flex;flex-direction:column;gap:6px}
.lbBar{display:grid;grid-template-columns:70px 1fr 90px;gap:10px;align-items:center;font-size:13px}
.lbBar .b{position:relative;height:14px;background:#eef1ed;border-radius:7px;overflow:hidden}
.lbBar .b i{position:absolute;left:0;top:0;bottom:0;background:var(--lg);border-radius:7px}
.lbBar .b i.dk{background:var(--dk);opacity:.85}
.lbBar .v{text-align:right}
.lgL,.lgD{display:inline-block;width:9px;height:9px;border-radius:2px;background:#0E6B57;margin:0 3px 0 8px}.lgD{background:#9A5A16}
@media (max-width:760px){.lbGrid2{grid-template-columns:1fr}.lbKpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:980px){.cols{grid-template-columns:1fr}.fields{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:248px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .btn.menuBtn{display:inline-flex;margin-bottom:14px}
  .main{padding:18px 16px 50px}
  .feed li{grid-template-columns:70px 1fr}.feed li .pn{grid-column:2}
}
</style>
</head>

  state.projects.forEach(function(p,i){
    var d = p.tasks.filter(function(t){return t.done;}), o = p.tasks.filter(function(t){return !t.done;});
    out.push((i+1)+". "+p.name+" — "+p.status+" · 진행률 "+pct(p)+"%"+(p.due?" · 마감 "+p.due+" ("+dday(p.due)+")":""));
    var ls = p.logs.filter(function(l){return l.date>=since;}).sort(function(a,b){return a.date<b.date?-1:1;});
    if(ls.length){ out.push("   ▸ 진행·결과"); ls.forEach(function(l){ out.push("     - ["+l.type+"] "+l.date.slice(5)+" "+l.text); }); }
    if(d.length) out.push("   ▸ 완료: "+d.map(function(t){return t.text;}).join(", "));
    if(o.length) out.push("   ▸ 남은 일: "+o.map(function(t){return t.text;}).join(", "));
    if(p.memo.trim()) out.push("   ▸ 메모: "+p.memo.trim().replace(/\n+/g," / "));
    out.push("");
  });
  return out.join("\n");
}
function toast(m){ var t=document.getElementById("toast"); if(!t) return; t.textContent=m; t.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove("on");},2200); }

// ---------- events ----------
document.addEventListener("click", function(e){
  var go = e.target.closest("[data-go]");
  if(go && !e.target.closest("a")){ location.hash = go.getAttribute("data-go"); return; }
  if(e.target.closest(".nav a")){ navOpen=false; }
  var b = e.target.closest("[data-act]"); if(!b) return;
  var act = b.getAttribute("data-act"), p = P(view());
  if(act==="regEx"){ var ta=document.querySelector('[data-form="reg"] textarea'); if(ta){ ta.value=b.getAttribute("data-q"); } var cb=document.querySelector('[data-form="reg"] input[name=all]'); regRun(view(), b.getAttribute("data-q"), cb&&cb.checked); return; }
  if(act==="regFull"){ e.preventDefault(); var n=+b.getAttribute("data-n"), st=regState[view()]; if(!st||!st.hits) return; var x=st.hits[n], card=document.getElementById("regHit"+n); if(!x||!card) return; var allV=[]; regTokens(st.q).forEach(function(g){allV=allV.concat(g.vars);}); card.querySelector(".rt").innerHTML=regMark(x.c.text, x.mv.length?x.mv:allV); b.remove(); return; }
  if(act==="regDl"){ regDownload(b); return; }
  if(act==="regZoom"){ b.closest("figure").classList.toggle("zoom"); return; }
  if(act==="regJump"){ e.preventDefault(); var nn=b.getAttribute("data-n"); var idx=/m$/.test(nn)?(parseInt(nn,10)-1):parseInt(nn,10); var el=document.getElementById("regHit"+idx); if(el){ var md=el.closest("details"); if(md) md.open=true; el.scrollIntoView({behavior:"smooth",block:"center"}); el.classList.add("flash"); setTimeout(function(){el.classList.remove("flash");},1600); } return; }
  if(act==="lbM"){ LB.ym=lbYmAdd(LB.ym,+b.getAttribute("data-n")); lbRefresh(); return; }
  if(act==="lbTab"){ LB.tab=b.getAttribute("data-t"); lbRefresh(); return; }
  if(act==="lbTeam"){ LB.team=b.getAttribute("data-t"); LB.claim=null; lbRefresh(); return; }
  if(act==="lbClaim"){ LB.claim=b.getAttribute("data-m"); lbRefresh(); return; }
  if(act==="lbMetric"){ LB.yMetric=b.getAttribute("data-t"); lbRefresh(); return; }
  if(act==="nav"){ navOpen=!navOpen; document.getElementById("side").classList.toggle("open",navOpen); e.stopPropagation(); return; }
  if(act==="toggle"){ var t = p.tasks.filter(function(x){return x.id===b.getAttribute("data-id");})[0]; if(t){ t.done=b.checked; if(t.done){ if(!p.logs.some(function(l){return l.date===today()&&l.text==="완료: "+t.text;})) p.logs.push({id:uid(),date:today(),type:"진행",text:"완료: "+t.text}); } else { p.logs=p.logs.filter(function(l){return !(l.date===today()&&l.text==="완료: "+t.text);}); } changed(); } return; }
  if(act==="delTask"){ p.tasks = p.tasks.filter(function(x){return x.id!==b.getAttribute("data-id");}); changed(); return; }
  if(act==="delLog"){ p.logs = p.logs.filter(function(x){return x.id!==b.getAttribute("data-id");}); changed(); return; }
  if(act==="delLink"){ p.links.splice(+b.getAttribute("data-i"),1); changed(); return; }
  if(act==="report"){ document.getElementById("rptText").value = report(document.getElementById("rptRange").value); document.getElementById("modal").classList.add("on"); return; }
  if(act==="closeRpt"){ document.getElementById("modal").classList.remove("on"); return; }
  if(act==="copyRpt"){ var ta=document.getElementById("rptText"); try{ navigator.clipboard.writeText(ta.value).then(function(){toast("보고서를 복사했습니다");},function(){ ta.select(); toast("텍스트를 선택했습니다 — Ctrl+C로 복사하세요"); }); }catch(err){ ta.select(); toast("텍스트를 선택했습니다 — Ctrl+C로 복사하세요"); } return; }
});
document.addEventListener("click", function(e){ if(navOpen && !e.target.closest("#side") && !e.target.closest("[data-act=nav]")){ navOpen=false; var s=document.getElementById("side"); if(s) s.classList.remove("open"); } });
document.addEventListener("change", function(e){
  if(e.target.id==="rptRange"){ document.getElementById("rptText").value = report(e.target.value); return; }
  var f = e.target.getAttribute && e.target.getAttribute("data-f"); if(!f) return;
  var p = P(view()); if(!p) return;
  var val = e.target.value;
  if(f==="status" && val!==p.status) p.logs.push({id:uid(),date:today(),type:"메모",text:"상태 변경: "+p.status+" → "+val});
  p[f] = val; changed();
});
document.addEventListener("submit", function(e){
  e.preventDefault();
  var fm = e.target, kind = fm.getAttribute("data-form");
  if(kind==="reg"){ regRun(view(), fm.q.value, fm.all.checked); return; }
  var p = P(view()); if(!p) return;
  if(kind==="task"){ var t=fm.t.value.trim(); if(!t) return; p.tasks.push({id:uid(),text:t,done:false}); }
  if(kind==="log"){ var t2=fm.t.value.trim(); if(!t2) return; p.logs.push({id:uid(),date:fm.d.value||today(),type:fm.ty.value,text:t2}); }
  if(kind==="link"){ var l=fm.l.value.trim(), u=fm.u.value.trim(); if(!u) return; if(!/^https?:\/\//.test(u)) u="https://"+u; p.links.push({label:l||u,url:u,note:""}); }
  changed();
  setTimeout(function(){ var el=document.querySelector('[data-form="'+kind+'"] input[name=t], [data-form="'+kind+'"] input[name=l]'); if(el) el.focus(); },0);
});
document.addEventListener("keydown", function(e){ if(e.key==="Enter" && !e.shiftKey && !e.isComposing && e.target.matches && e.target.matches('[data-form="reg"] textarea')){ e.preventDefault(); var f=e.target.form; regRun(view(), f.q.value, f.all.checked); } });
window.addEventListener("hashchange", function(){ try{ sessionStorage.setItem("lab-ws-view", view()); }catch(e){} navOpen=false; render(); window.scrollTo(0,0); });

// ---------- boot ----------
if(!location.hash){ try{ var sv=sessionStorage.getItem("lab-ws-view"); if(sv && sv!=="home") history.replaceState(null,"","#"+sv); }catch(e){} }
render();
function fallback(){ loadLocal(); mode="local"; setSave("local"); render(); }
var tries = 0;
(function connect(){ return;
  try{
    if(window.claude && window.claude.use){
      window.claude.use("artifact").then(function(a){
        if(a && a.publish){ art=a; mode="shared"; setSave("ok"); } else fallback();
      }, fallback);
    } else if(++tries < 15){ setTimeout(connect, 200); }
    else fallback();
  }catch(e){ fallback(); }
})();
})();
